[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mycobotpro450-modbus"
version = "0.1.0"
description = "MyCobot Pro 450 Modbus RTU client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mycobotpro450_modbus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
